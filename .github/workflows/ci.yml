name: Воспроизведение Axiom
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: axiom/axiom-stack
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - working-directory: axiom/axiom-stack
        run: |
          python3 bootstrap.py --directory ..
          python3 reference-smoke.py
          python3 reference-v0.2.py
      - working-directory: axiom/axiom-symbolic
        run: python3 -m unittest discover -s tests -v
      - working-directory: axiom/axiom-cegis
        run: python3 -m unittest discover -s tests -v
